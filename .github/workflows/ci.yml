name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Show Python version
        run: python3 --version
      - name: Run FAST tier
        run: python3 scripts/run_test_tier.py fast

  validation:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Show Python version
        run: python3 --version
      # Use the runner's supported Node; do not skip checks or upgrade runtimes.
      - name: Verify supported Node for isolated authentication tests
        run: node -e "const [major,minor]=process.versions.node.split('.').map(Number); if (!((major===22 && minor>=12)||major===24)) process.exit(1)"
      - name: Prepare pinned isolated authentication dependency
        run: npm ci --prefix runtime-candidates/admin-auth-only-jose --ignore-scripts --no-audit --no-fund
      - name: Compile Python for PR regression
        if: github.event_name == 'pull_request'
        run: python3 -m compileall -q scripts tests
      - name: Run REGRESSION tier
        if: github.event_name == 'pull_request'
        run: python3 scripts/run_test_tier.py regression
      - name: Run FULL tier
        if: github.event_name == 'push'
        run: python3 scripts/run_test_tier.py full
